# Frontend CI/CD — GitHub Actions -> Azure Static Web Apps.
#
# The frontend is a Vite + React + TypeScript app. It is built here rather than by
# Static Web Apps' own Oryx build, so a type error fails this workflow with a
# readable message instead of surfacing as an opaque deployment failure.

name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  contents: read
  pull-requests: write

env:
  # The only backend. The dev slot was removed with the move to a B1 plan, so there is
  # no staging URL to point at — test against a locally run backend instead.
  API_BASE: https://qthr-faq-api.azurewebsites.net

  # Entra sign-in. While these are empty the app uses the dev-header identity that
  # AUTH_MODE=dev expects, and the "Dev only" role switch stays visible. Fill all
  # three at the same time as flipping AUTH_MODE=entra on the backend — set them
  # earlier and the frontend will send tokens the API is not yet configured to
  # accept. See docs/ENTRA_SETUP.md; the values are not secrets.
  #
  # The scope is the exposed `access_as_user` delegated permission, NOT `.default`.
  # The SPA and the API are one registration, and `.default` on your own app with no
  # granted client permissions fails at token acquisition rather than at sign-in —
  # the popup succeeds and the first API call is what breaks, which is a confusing
  # way to find out. The registration pre-authorizes itself for this scope, so there
  # is no consent prompt.
  ENTRA_CLIENT_ID: 'efccb481-74ba-45b8-940a-fed5dfbec74e'
  ENTRA_TENANT_ID: '0eadb77e-42dc-47f8-bbe3-ec2395e0712c'
  ENTRA_API_SCOPE: 'api://efccb481-74ba-45b8-940a-fed5dfbec74e/access_as_user'

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Written into public/ before the build so Vite copies it to the site root.
      # Keeping the API base out of the bundle means the same source can target a
      # different backend without a code change.
      - name: Generate config.js
        working-directory: frontend
        run: |
          cat > public/config.js <<EOF
          window.APP_CONFIG = {
            apiBase: "${API_BASE}",
            entra: {
              clientId: "${ENTRA_CLIENT_ID}",
              tenantId: "${ENTRA_TENANT_ID}",
              scope: "${ENTRA_API_SCOPE}"
            }
          };
          EOF
          cat public/config.js

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The built output, not the source: skip_app_build means Static Web Apps
          # uploads this folder verbatim.
          app_location: 'frontend/dist'
          output_location: ''
          skip_app_build: true

  # Pull requests get their own preview URL; this tears it down on close.
  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR preview
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
