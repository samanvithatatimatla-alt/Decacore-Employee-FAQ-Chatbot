# Frontend CI/CD — GitHub Actions -> Azure Static Web Apps.
#
# The frontend is plain HTML/CSS/JS with no build step, so this uploads the folder
# as-is. The only generated file is config.js, which carries the backend URL —
# app.js reads window.APP_CONFIG.apiBase and falls back to localhost for local work.

name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  contents: read
  pull-requests: write

env:
  # Production slot. Point at qthr-faq-api-dev.azurewebsites.net to test against the dev slot.
  API_BASE: https://qthr-faq-api.azurewebsites.net

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      # Written at deploy time rather than committed, so the same source can target
      # different backends without a code change.
      - name: Generate config.js
        run: |
          cat > frontend/config.js <<EOF
          window.APP_CONFIG = { apiBase: "${API_BASE}" };
          EOF
          cat frontend/config.js

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'frontend'
          output_location: ''
          skip_app_build: true

  # Pull requests get their own preview URL; this tears it down on close.
  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR preview
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
